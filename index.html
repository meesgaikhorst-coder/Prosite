<!DOCTYPE html>
<html lang="en" style="scrollbar-width: 0px;">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typotheque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="headermodule">
    <div id="typotheque">TYPOTHEQUE</div>

    <button id="menu" aria-label="Open menu">☰</button>

    <div class="header-right">
        <button id="login">Log In</button>
        <button id="search" aria-label="Search">⌕</button>
    </div>
</header>

<main>
    <section class="hero">
        <h1>Zed</h1>

        <div class="slider slider-one">
            <strong>Weight</strong>
            <span>900</span>
        </div>

        <div class="slider slider-two">
            <strong>Width</strong>
            <span>51</span>
        </div>

        <div class="slider slider-three">
            <strong>Rounding</strong>
            <span>96</span>
        </div>

        <div class="slider slider-four">
            <strong>Slant</strong>
            <span>15</span>
        </div>

        <p class="tagline">
            A sans for the needs of the 21st century.
        </p>
    </section>

    <section class="categories">
        <article class="category all-fonts">
            <h2>All Fonts</h2>
        </article>

        <article class="category global-fonts">
            <h2>Global Fonts</h2>
        </article>

        <article class="category variable-fonts">
            <h2>Variable Fonts</h2>
        </article>

        

        <article class="category smart-fonts">
            <h2>Smart Fonts</h2>
        </article>

        <article class="category superfam">
            <h2>Superfamilies</h2>
        </article>

        <article class="category legibility">
            <h2>Legibility Fonts</h2>
        </article>

        <article class="category optical">
            <h2>Optical Sizes</h2>
        </article>
    </section>
</main>


</body>
</html>
